<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width" />
    <title></title>
    <script src="scripts/jquery-1.8.3.min.js"></script>
</head>
<body>
    <form id="UpdateResult">
        <fieldset>
            <table cellpadding="2" cellspacing="2" border="0">
                <tr>
                    <td>- LeagueIds:</td>
                    <td><input type="text" id="leagueIds" value="" /> Ex: 12345,98734</td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="button" id="Submit" value="Submit">
                        <input type="button" id="ClearLeagueTest" value="Clear league test PRO">
                    </td>
                </tr>
            </table>
        </fieldset>

        <table cellpadding="2" cellspacing="2" border="0">
            <tr>
                <td>
                    <fieldset>
                        <legend>Setting on UAT:</legend>
                        <span id="leagueIdsUat"></span>
                    </fieldset>
                </td>
                <td>
                    <fieldset>
                        <legend>Setting on PRO:</legend>
                        <span id="leagueIdsPro"></span>
                    </fieldset>
                </td>
            </tr>
        </table>
    </form>
    <br>
</body>
</html>

<script type="text/javascript">
    getSetting();
    function getSetting() {
        $.ajax({
            type: "GET",
            url: "api/league-test/get",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            success: function (result) {
                $('#leagueIdsUat').html(result.uat.replace("\n", "<br />", "g"))
                $('#leagueIdsPro').html(result.pro.replace("\n", "<br />", "g"))

            }
        });
    }

    $('#ClearLeagueTest').click(function (e) {
        var con = confirm("Are you sure you want to clear league test on the production?")
        if (con) {
            var params = {
                LeagueIds: "",
                IsClear: true
            };

            $.ajax({
                type: "POST",
                url: "api/league-test/update",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                data: JSON.stringify(params),
                success: function (result) {
                    location.reload();

                },
                error: function () {
                    console.log("Error");
                },
                complete: function () {
                    console.log("Complete");
                }
            });
        }

    });

    $('#Submit').click(function (e) {
        var leagueids = $('#leagueIds').val();

        if (leagueids === "") {
            alert("Please input leagueId.");
            return;
        }

        var params = {
            LeagueIds: leagueids,
            IsClear: false
        };

        $.ajax({
            type: "POST",
            url: "api/league-test/update",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            data: JSON.stringify(params),
            success: function (result) {
                location.reload();

            },
            error: function () {
                console.log("Error");
            },
            complete: function () {
                console.log("Complete");
            }
        });
    });
</script>
