<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width" />
    <title></title>
    <script src="scripts/jquery-1.8.3.min.js"></script>
</head>
<body>
    <form id="UpdateResult">
        <fieldset>
            <legend>Update League Test for 2 services(AutoInstant + AutoPayout):</legend>
            <table cellpadding="2" cellspacing="2" border="0">
                <tr>
                    <td>- LeagueIds:</td>
                    <td><input type="text" onkeypress='validate(event)' id="leagueIds" value="" /> Ex: 1234</td>
                    <td width="70px"></td>
                    <td>
                        <span>LeagueIdExclude:</span>
                        <span id="leagueIdExclude"></span>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="button" id="Submit" value="Submit">
                        <input type="button" id="ClearLeagueTest" value="Clear league test PRO">
                    </td>
                    <td></td>
                    <td>
                        <span>LeagueIdInclude:</span>
                        <span id="leagueIdInclude"></span>
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
    <br>
</body>
</html>

<script type="text/javascript">
    getSetting();
    function getSetting() {
        $.ajax({
            type: "GET",
            url: "api/league-test/get",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            success: function (result) {
                $('#leagueIdExclude').html(result.excludeLeagueId)
                $('#leagueIdInclude').html(result.includeLeagueId)

            }
        });
    }

    $('#ClearLeagueTest').click(function (e) {
        var con = confirm("Are you sure you want to clear league test on the production?")
        if (con) {
            var params = {
                LeagueIds: "",
                IsClear: true
            };

            $.ajax({
                type: "POST",
                url: "api/league-test/update",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                data: JSON.stringify(params),
                success: function (result) {
                    location.reload();

                },
                error: function () {
                    console.log("Error");
                },
                complete: function () {
                    console.log("Complete");
                }
            });
        }

    });

    $('#Submit').click(function (e) {
        var leagueids = $('#leagueIds').val();

        if (leagueids === "") {
            alert("Please input leagueId.");
            return;
        }

        var params = {
            LeagueIds: leagueids,
            IsClear: false
        };

        $.ajax({
            type: "POST",
            url: "api/league-test/update",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            data: JSON.stringify(params),
            success: function (result) {
                location.reload();

            },
            error: function () {
                console.log("Error");
            },
            complete: function () {
                console.log("Complete");
            }
        });
    });

    function validate(evt) {
        var theEvent = evt || window.event;

        // Handle paste
        if (theEvent.type === 'paste') {
            key = event.clipboardData.getData('text/plain');
        } else {
            // Handle key press
            var key = theEvent.keyCode || theEvent.which;
            key = String.fromCharCode(key);
        }
        var regex = /[0-9]|\./;
        if (!regex.test(key)) {
            theEvent.returnValue = false;
            if (theEvent.preventDefault) theEvent.preventDefault();
        }
    }
</script>
