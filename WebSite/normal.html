<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width" />
    <title></title>
    <script src="scripts/jquery-1.8.3.min.js"></script>
</head>
<body>
    <form id="UpdateResult">
        <fieldset>
            MatchId:<br>
            <input type="number" id="MatchId" value="" /><br>
            Source:<br>
            <select name="SourceId" id="SourceId">
                <option value="1">SBOBET</option>
                <option value="6">BetISN</option>
                <option value="8">SingBet</option>
            </select><br>
            Status:<br>
            <select name="TypeId" id="TypeId">
                <option value="1">HALF_TIME_FINISH</option>
                <option value="2">FINISH</option>
            </select><br>
            Home Value:<br>
            <input type="text" id="HomeValue" value="" /><br>
            Away Value:<br>
            <input type="text" id="AwayValue" value="" /><br>

            <br>

            <input type="button" id="Submit" value="Submit">
        </fieldset>
    </form>
    <br>
</body>
</html>

<script type="text/javascript">
    var resultScore = [];
    $('#Submit').click(function (e) {
        updateResult();
    });

    function validationForm() {
        if ($('#MatchId').val() === null || $('#MatchId').val() === "") {
            alert("Invalid MatchId");
            return false;
        }
        return true;
    }

    function getParam() {
        return param = {
            MatchId: $('#MatchId').val(),
            ResultInfo: [(setValueResultScore())],
            SecurityToken: "3BEAED79-1305-4213-BF4D-3B10DF385BA4"
        };
    }

    function setValueResultScore() {
        return resultScore = {
            SourceId: $('#SourceId').val(),
            TypeId: $('#TypeId').val(),
            HomeValue: $('#HomeValue').val(),
            AwayValue: $('#AwayValue').val()
        };
    }

    function updateResult() {

        var param = getParam();

        $.ajax({
            type: "POST",
            url: "api/Match/singleMatch",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            data: JSON.stringify(param),
            success: function (result) {

                if (result.ErrCode === 0) {
                    alert("Success");
                } else {
                    alert(result.ErrMsg);
                }

            },
            error: function () {
                alert("Error");
            }
        });
    }

    $('#Add').click(function (e) {
        addMultiResult();
    })

    function addMultiResult() {
        multiParam.push(setValueResultScore())
        if (resultScore.length !== 1) {
            resultScore[resultScore.length - 1].MatchId = resultScore[resultScore.length - 2].MatchId + 1;
        }
    };

    function multiUpdateResult() {
        if (!validationForm()) {
            return;
        }

        $.ajax({
            type: "POST",
            url: "api/Match/multipleMatch",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            data: JSON.stringify(multiParam),
            success: function () {
                if (result.ErrCode === 0) {
                    alert("Success");
                } else {
                    alert(result.ErrMsg);
                }
            },
            error: function () {
                alert("Error");
            }
        });
    }
</script>
