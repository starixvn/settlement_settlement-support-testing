<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width" />
    <title></title>
    <script src="scripts/jquery-1.8.3.min.js"></script>
</head>
<body>
    <form id="UpdateResult">
        <fieldset>
            MatchId:<br>
            <input type="number" id="MatchId" value="" /><br>
            <br />
            <div><a href="#" onclick="AddGoal();">Add goal</a></div>
            <div id="block" style="padding-left:20px;">
                Goal Time:<br>
                <input type="text" name="GoalId[]" id="GoalId[]" value="" /><br>

                <input type="checkbox" name="IsHome[]" />Is Home<br>

                Home Value:<br>
                <input type="text" name="HomeValue[]" value="" /><br>
                Away Value:<br>
                <input type="text" name="AwayValue[]" value="" /><br>
                <br>
                <div style="height:1px; width:200px; background-color:#000"></div>
                <br />
            </div>
            <div id="cloneBlock" style="padding-left:20px;"></div>
            <br />
            <input type="button" id="Submit" value="Submit">
        </fieldset>
    </form>
    <br>
    <script type="text/javascript">

        $('#Submit').click(function (e) {
            if ($('#MatchId').val() === null || $('#MatchId').val() === "") {
                alert("Invalid MatchId");
                return false;
            }

            updateResult();

        });

        function AddGoal() {
            var copy = $("#block").html();
            $("#cloneBlock").append(copy);
        }

        function getParam() {

            var score = [];
            var n = $("input[name^='GoalId']").length;
            for (i = 0; i < n; i++) {
                goalTime = $("input[name^='GoalId']").eq(i).val();;
                isHome = $("input[name^='IsHome']").eq(i).is(':checked');
                homeValue = $("input[name^='HomeValue']").eq(i).val();
                awayValue = $("input[name^='AwayValue']").eq(i).val();

                resultScore = {
                    SourceId: 5,
                    GoalTime: parseInt(goalTime),
                    IsHome: isHome,
                    HomeValue: homeValue,
                    AwayValue: awayValue
                };
                score.push(resultScore);
            }

            return param = {
                MatchId: parseInt($('#MatchId').val()),
                ResultInfo: score,
                SecurityToken: "3BEAED79-1305-4213-BF4D-3B10DF385BA4"
            };
        }

        function updateResult() {
            var param = getParam();

            $.ajax({
                type: "POST",
                url: "api/match/goal-record",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                data: JSON.stringify(param),
                success: function (result) {

                    if (result.ErrCode === 0) {
                        alert("Success");
                    } else {
                        alert(result.ErrMsg);
                    }

                },
                error: function () {
                    console.log("Error");
                },
                complete: function () {
                    console.log("Complete");
                }
            });

        }
    </script>
</body>
</html>
